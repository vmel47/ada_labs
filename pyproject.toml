[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-lab"
version = "0.1.0"
description = "Local, evidence-based experiments for Agent Development Architecture"
requires-python = ">=3.11"
dependencies = ["playwright==1.64.1"]

[project.scripts]
ada-lab = "ada_lab.cli:main"

[tool.setuptools]
packages = ["ada_lab"]

[tool.setuptools.package-data]
ada_lab = ["*.js"]
